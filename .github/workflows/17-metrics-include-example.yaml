name: 17 - Include Example

on:
  workflow_dispatch:

jobs:
  include-example:
    runs-on: ubuntu-latest

    name: ${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}

    strategy:
      matrix:
        color: [red, green]
        shape: [circle, square]
        size: [small, large]

        include:
          - color: red
            shape: circle
            tag: nile-house

    steps:
      - name: Dummy step
        run: echo "${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{matrix.tag}}"
