name: 18- Exploring Exclude Option

on:
  workflow_dispatch:

jobs:
  include-example:
    runs-on: ubuntu-latest

    name: ${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}

    strategy:
      matrix:
        color: [red, green]
        shape: [circle, square]
        size: [small, large]
        opacity: [50, 75]

        include:
          - opacity: 50

        exclude:
          - opacity: 75

    steps:
      - name: Dummy step
        run: echo "${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}"
