name: 04 - Using Actions

on:
  workflow_dispatch:  # Changed from push to prevent auto-runs

jobs:
  build:
    name: Build and Test React App
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        # WHY: Downloads our code into the runner
        # HOW: Clones the repository to $GITHUB_WORKSPACE
        # WHAT: Essential for any workflow that needs our code
        
      # Step 2: Setup Node.js environment
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
        # WHY: Ensures consistent Node.js version across environments
        # HOW: Downloads and configures specified Node.js version
        # WHAT: node-version: '20.x' = Uses latest Node.js 20 version
        
      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci
        working-directory: 04-using-actions/react-app
        # WHY: npm ci is faster and more reliable than npm install for CI
        # HOW: Uses package-lock.json for exact versions
        # WHAT: working-directory = runs command in specific folder
        
      # Step 4: Run automated tests
      - name: Run Unit Tests
        run: npm run test -- --watchAll=false
        working-directory: 04-using-actions/react-app
        # WHY: --watchAll=false runs tests once instead of watch mode
        # HOW: Executes React testing scripts
        # WHAT: Runs all test suites defined in the React app